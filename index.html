<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce By Mindque</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --motion-fast: 0.18s ease;
      --motion-smooth: 0.48s cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-lift: 0 26px 76px rgba(15, 23, 42, 0.12);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #eef7f3, #f8f7ef);
      background-size: 180% 180%;
      color: #111827;
      animation: loginAura 18s ease-in-out infinite;
    }

    main {
      width: min(100% - 36px, 1080px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 34px;
      align-items: center;
      padding: 34px 0;
      animation: pageFadeIn 0.5s ease both;
    }

    .intro,
    .login-panel {
      background: #ffffff;
      border-radius: 34px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
      position: relative;
      overflow: hidden;
      transition: transform var(--motion-smooth), box-shadow var(--motion-smooth);
    }

    .intro::before,
    .login-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: -70%;
      width: 52%;
      height: 100%;
      background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.68) 50%, transparent 100%);
      transform: skewX(-14deg);
      pointer-events: none;
    }

    .intro:hover,
    .login-panel:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lift);
    }

    .intro:hover::before,
    .login-panel:hover::before {
      animation: panelSheen 0.9s ease;
    }

    .intro {
      padding: 46px;
      animation: slideInLeft 0.58s var(--motion-smooth) both;
    }

    .login-panel {
      padding: 34px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
      animation: slideInRight 0.58s var(--motion-smooth) 0.08s both;
    }

    .brand {
      margin-bottom: 28px;
      color: #2563eb;
      font-size: 24px;
      font-weight: 900;
    }

    .logo {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 0 0 34px;
      object-fit: contain;
      animation: brandFloat 5.5s ease-in-out infinite;
    }

    h1 {
      max-width: 520px;
      margin: 0 0 18px;
      font-size: 56px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: #6b7280;
      font-size: 18px;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 42px;
    }

    .stat {
      min-height: 112px;
      padding: 20px;
      border-radius: 24px;
      background: #f5f6fa;
      transition: transform var(--motion-smooth), background var(--motion-fast), box-shadow var(--motion-smooth);
      animation: statPop 0.48s var(--motion-smooth) both;
    }

    .stat:nth-child(2) {
      animation-delay: 0.1s;
    }

    .stat:nth-child(3) {
      animation-delay: 0.18s;
    }

    .stat:hover {
      transform: translateY(-5px) scale(1.015);
      background: #ffffff;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }

    .stat-value {
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 900;
      animation: valuePulse 0.5s ease both;
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #111827;
      font-size: 15px;
      font-weight: 800;
    }

    .required {
      color: #f04f3e;
    }

    .field {
      margin-bottom: 24px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 56px;
      padding: 0 58px 0 18px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      color: #111827;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color var(--motion-fast), box-shadow var(--motion-fast), transform var(--motion-fast);
    }

    input::placeholder {
      color: #77738d;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      transform: translateY(-1px);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 22px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #77738d;
      transform: translateY(-50%);
      cursor: pointer;
      transition: color var(--motion-fast), transform var(--motion-fast);
    }

    .toggle-password:hover {
      color: #2563eb;
      background: transparent;
      transform: translateY(-50%) scale(1.08);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 4px 0 28px;
      font-size: 14px;
      font-weight: 700;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin: 0;
      accent-color: #2563eb;
      cursor: pointer;
      transition: transform var(--motion-fast);
    }

    input[type="checkbox"]:hover {
      transform: scale(1.08);
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 18px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 24px rgba(37, 99, 235, 0.2);
      position: relative;
      overflow: hidden;
      transition: background var(--motion-fast), transform var(--motion-fast), box-shadow var(--motion-fast);
    }

    .login-button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.42) 48%, transparent 72%);
      transform: translateX(-120%);
      pointer-events: none;
    }

    .login-button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(37, 99, 235, 0.24);
    }

    .login-button:hover::after {
      animation: sheenSweep 0.8s ease;
    }

    .login-button:active {
      transform: translateY(0) scale(0.99);
    }

    @keyframes loginAura {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes pageFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-24px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(24px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes statPop {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes valuePulse {
      0% { transform: translateY(5px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes brandFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes panelSheen {
      from { left: -70%; }
      to { left: 120%; }
    }

    @keyframes sheenSweep {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 18px 0;
      }

      .intro,
      .login-panel {
        padding: 28px;
      }

      .logo {
        width: min(100%, 300px);
        margin-bottom: 28px;
      }

      h1 {
        font-size: 42px;
      }

      h2 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <div class="brand">Workforce By Mindque</div>
      <img class="logo" src="assets/studit-logo-cropped.png" alt="Workforce By Mindque logo">
      <h1>Attendance that feels effortless.</h1>
      <p class="subtitle">Sign in to manage punch in, breaks, location-backed attendance, and team reports.</p>

      <div class="stats">
        <div class="stat">
          <div class="stat-value">Live</div>
          <div class="stat-label">Attendance tracking</div>
        </div>
        <div class="stat">
          <div class="stat-value">HR</div>
          <div class="stat-label">Admin reporting</div>
        </div>
        <div class="stat">
          <div class="stat-value">Safe</div>
          <div class="stat-label">Role based access</div>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <h2>Welcome back</h2>
      <p class="subtitle" style="margin-bottom:32px;">Login to continue to Workforce By Mindque.</p>

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="Enter your mail address" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
          <button class="toggle-password" type="button" onclick="togglePassword()" aria-label="Show password">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 3L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M10.6 10.8A2 2 0 0 0 13.2 13.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M7.5 7.8C5.5 8.9 4 10.6 3 12c2.2 3.2 5.2 5 9 5 1.3 0 2.4-.2 3.5-.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.2 5.2C10.8 5.1 11.4 5 12 5c3.8 0 6.8 1.8 9 5-0.5.8-1.2 1.6-2 2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="options">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" checked>
          <span>Remember me</span>
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="login-button" onclick="login()">Log In</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNeTvM8AR-hWitTD_MTK1AUHGTHUPWlcQ",
      authDomain: "studit-attendance.firebaseapp.com",
      projectId: "studit-attendance",
      storageBucket: "studit-attendance.firebasestorage.app",
      messagingSenderId: "891531257178",
      appId: "1:891531257178:web:92679d4e304c514800bf63",
      measurementId: "G-77M6T37TXJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePassword = function () {
      const password = document.getElementById("password");
      const isHidden = password.type === "password";
      password.type = isHidden ? "text" : "password";
    };

    window.login = async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        console.log("Logged in UID:", user.uid);
        console.log("Logged in Email:", user.email);

        const userRef = doc(db, "employees", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          alert("User not found in employees collection");
          return;
        }

        const data = userSnap.data();

        if (data.role === "admin") {
          window.location.href = "admin.html";
        } else if (data.role === "employee") {
          window.location.href = "dashboard.html";
        } else {
          alert("Invalid role");
        }
      } catch (error) {
        alert(error.message);
      }
    };
  </script>
</body>
</html>
