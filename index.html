<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce By Mindque</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #eef7f3, #f8f7ef);
      color: #111827;
    }

    main {
      width: min(100% - 36px, 1080px);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 34px;
      align-items: center;
      padding: 34px 0;
    }

    .intro,
    .login-panel {
      background: #ffffff;
      border-radius: 34px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06);
    }

    .intro {
      padding: 46px;
    }

    .login-panel {
      padding: 34px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .brand {
      margin-bottom: 28px;
      color: #2563eb;
      font-size: 24px;
      font-weight: 900;
    }

    .logo {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 0 0 34px;
      object-fit: contain;
    }

    h1 {
      max-width: 520px;
      margin: 0 0 18px;
      font-size: 56px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: #6b7280;
      font-size: 18px;
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 42px;
    }

    .stat {
      min-height: 112px;
      padding: 20px;
      border-radius: 24px;
      background: #f5f6fa;
    }

    .stat-value {
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 900;
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #111827;
      font-size: 15px;
      font-weight: 800;
    }

    .required {
      color: #f04f3e;
    }

    .field {
      margin-bottom: 24px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 56px;
      padding: 0 58px 0 18px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      color: #111827;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #77738d;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 22px;
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #77738d;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .toggle-password:hover {
      color: #2563eb;
      background: transparent;
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 4px 0 28px;
      font-size: 14px;
      font-weight: 700;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      margin: 0;
      accent-color: #2563eb;
      cursor: pointer;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      height: 56px;
      padding: 0 24px;
      border: 0;
      border-radius: 18px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 24px rgba(37, 99, 235, 0.2);
      transition: background 0.2s, transform 0.2s;
    }

    .login-button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 18px 0;
      }

      .intro,
      .login-panel {
        padding: 28px;
      }

      .logo {
        width: min(100%, 300px);
        margin-bottom: 28px;
      }

      h1 {
        font-size: 42px;
      }

      h2 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <div class="brand">Workforce By Mindque</div>
      <img class="logo" src="assets/studit-logo-cropped.png" alt="Workforce By Mindque logo">
      <h1>Attendance that feels effortless.</h1>
      <p class="subtitle">Sign in to manage punch in, breaks, location-backed attendance, and team reports.</p>

      <div class="stats">
        <div class="stat">
          <div class="stat-value">Live</div>
          <div class="stat-label">Attendance tracking</div>
        </div>
        <div class="stat">
          <div class="stat-value">HR</div>
          <div class="stat-label">Admin reporting</div>
        </div>
        <div class="stat">
          <div class="stat-value">Safe</div>
          <div class="stat-label">Role based access</div>
        </div>
      </div>
    </section>

    <section class="login-panel">
      <h2>Welcome back</h2>
      <p class="subtitle" style="margin-bottom:32px;">Login to continue to Workforce By Mindque.</p>

      <div class="field">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="Enter your mail address" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password <span class="required">*</span></label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
          <button class="toggle-password" type="button" onclick="togglePassword()" aria-label="Show password">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 3L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M10.6 10.8A2 2 0 0 0 13.2 13.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M7.5 7.8C5.5 8.9 4 10.6 3 12c2.2 3.2 5.2 5 9 5 1.3 0 2.4-.2 3.5-.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M10.2 5.2C10.8 5.1 11.4 5 12 5c3.8 0 6.8 1.8 9 5-0.5.8-1.2 1.6-2 2.3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="options">
        <label class="remember" for="remember">
          <input type="checkbox" id="remember" checked>
          <span>Remember me</span>
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="login-button" onclick="login()">Log In</button>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCNeTvM8AR-hWitTD_MTK1AUHGTHUPWlcQ",
      authDomain: "studit-attendance.firebaseapp.com",
      projectId: "studit-attendance",
      storageBucket: "studit-attendance.firebasestorage.app",
      messagingSenderId: "891531257178",
      appId: "1:891531257178:web:92679d4e304c514800bf63",
      measurementId: "G-77M6T37TXJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePassword = function () {
      const password = document.getElementById("password");
      const isHidden = password.type === "password";
      password.type = isHidden ? "text" : "password";
    };

    window.login = async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        console.log("Logged in UID:", user.uid);
        console.log("Logged in Email:", user.email);

        const userRef = doc(db, "employees", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          alert("User not found in employees collection");
          return;
        }

        const data = userSnap.data();

        if (data.role === "admin") {
          window.location.href = "admin.html";
        } else if (data.role === "employee") {
          window.location.href = "dashboard.html";
        } else {
          alert("Invalid role");
        }
      } catch (error) {
        alert(error.message);
      }
    };
  </script>
</body>
</html>
